name: Update enrollment one-pager

on:
  push:
    paths:
      - ".github/workflows/update-enrollment-onepager.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tooling
        run: pip install pymupdf

      - name: Replace terminology and verify
        run: |
          python - <<'PY'
          import statistics
          import fitz

          path = "case-study/Enrollment_Outpatient_Visit_Processing_Pipeline_One_Pager.pdf"
          old_text = "Resident-level period construction from recurring files"
          new_text = "Patient-level period construction from recurring files"

          doc = fitz.open(path)
          page = doc[0]
          matches = page.search_for(old_text)
          if len(matches) != 1:
              raise RuntimeError(f"Expected exactly one match for {old_text!r}, found {len(matches)}")
          rect = matches[0]

          span = None
          for block in page.get_text("dict")["blocks"]:
              for line in block.get("lines", []):
                  for candidate in line.get("spans", []):
                      if "Resident-level period construction" in candidate.get("text", ""):
                          span = candidate
                          break
                  if span:
                      break
              if span:
                  break
          if span is None:
              raise RuntimeError("Could not identify source text span.")

          print("Source span:", span)
          print("Replacement rect:", rect)

          zoom = 3
          pix = page.get_pixmap(matrix=fitz.Matrix(zoom, zoom), alpha=False)
          sample_points = [
              (rect.x0 + 4, rect.y0 - 3),
              (rect.x0 + rect.width / 2, rect.y0 - 3),
              (rect.x1 - 4, rect.y0 - 3),
              (rect.x0 + 4, rect.y1 + 3),
              (rect.x0 + rect.width / 2, rect.y1 + 3),
              (rect.x1 - 4, rect.y1 + 3),
          ]
          rgb_samples = []
          for x, y in sample_points:
              px = min(max(int(x * zoom), 0), pix.width - 1)
              py = min(max(int(y * zoom), 0), pix.height - 1)
              rgb_samples.append(pix.pixel(px, py)[:3])
          bg = tuple(statistics.median(v[i] for v in rgb_samples) / 255 for i in range(3))
          fg255 = fitz.sRGB_to_rgb(span["color"])
          fg = tuple(v / 255 for v in fg255)
          print("Background sample:", bg, "Text color:", fg)

          import subprocess
          font_path = subprocess.check_output(
              ["fc-match", "Noto Sans", "-f", "%{file}"],
              text=True,
          ).strip()
          if not font_path:
              raise RuntimeError("Noto Sans font not available on runner.")
          print("Using font:", font_path)

          pad_x = 1.5
          pad_y = 1.0
          redact_rect = fitz.Rect(rect.x0 - pad_x, rect.y0 - pad_y, rect.x1 + pad_x, rect.y1 + pad_y)
          page.add_redact_annot(redact_rect, fill=bg)
          page.apply_redactions()

          fontsize = float(span["size"])
          baseline_y = float(span["origin"][1])
          page.insert_text(
              fitz.Point(rect.x0, baseline_y),
              new_text,
              fontsize=fontsize,
              fontname="noto",
              fontfile=font_path,
              color=fg,
              overlay=True,
          )

          temp = path + ".tmp.pdf"
          doc.save(temp, garbage=4, deflate=True)
          doc.close()

          check = fitz.open(temp)
          text = check[0].get_text()
          if new_text not in text:
              raise RuntimeError("Replacement text not found after save.")
          if old_text in text:
              raise RuntimeError("Old text still present after save.")
          check[0].get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False).save("onepager-preview.png")
          check.close()

          import os
          os.replace(temp, path)
          print("PDF terminology update verified.")
          PY

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: enrollment-onepager-preview
          path: onepager-preview.png

      - name: Commit corrected PDF and remove temporary workflow
        run: |
          rm .github/workflows/update-enrollment-onepager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-study/Enrollment_Outpatient_Visit_Processing_Pipeline_One_Pager.pdf .github/workflows/update-enrollment-onepager.yml
          git commit -m "Correct enrollment case study terminology"
          git push

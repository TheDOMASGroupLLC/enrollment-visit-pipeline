name: Code checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall pipeline run_enrollment_pipeline.py
      - name: Import pipeline modules
        run: python -c "from pipeline.process_enrollment import process_enrollment; from pipeline.transform import summarize_enrollment_spans"
